<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>amis preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/amis@2.0.0/sdk/sdk.css" />
    <style>
      html, body, .app-wrapper {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .app-wrapper { overflow: auto; }
    </style>
  </head>
  <body>
    <div id="root" class="app-wrapper"></div>
    <script src="https://unpkg.com/amis@2.0.0/sdk/sdk.js"></script>
    <script>
      (function () {
        let amis = amisRequire('amis/embed');
        
        // 默认 amisJSON（用于初始渲染）
        let amisJSON = {
          type: 'page',
          title: '默认页面',
          body: {
            type: 'tpl',
            tpl: '<div style="padding:20px;color:#999;text-align:center;">暂无预览内容</div>'
          }
        };
        
        let amisScoped = null;
        
        // 渲染函数
        function renderAmis(schema, data) {
          try {
            let finalSchema = schema || amisJSON;
            // 确保是 page 类型
            if (finalSchema.type !== 'page') {
              finalSchema = { type: 'page', body: finalSchema };
            }
            // 渲染到 #root
            amisScoped = amis.embed('#root', finalSchema, data || {}, {
              fetcher: function() {
                return Promise.resolve({ status: 200, headers: {}, data: {} });
              }
            });
          } catch (e) {
            console.error('[iframe] Render error:', e);
            document.getElementById('root').innerHTML = 
              '<div style="padding:20px;color:#f00;">渲染错误: ' + e.message + '</div>';
          }
        }
        
        // 页面加载时渲染默认 JSON
        renderAmis(amisJSON, {});
        
        // 监听 postMessage 动态更新
        window.addEventListener('message', function(event) {
          var msgData = event.data || {};
          if (msgData.type === 'amis-schema-update') {
            console.log('[iframe] Received schema update');
            renderAmis(msgData.schema, msgData.data);
          }
        });
        
        // 通知父页面 iframe 已就绪
        window.parent.postMessage({ type: 'iframe-ready' }, '*');
      })();
    </script>
  </body>
</html>
